name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test (blank uses the selected branch)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: mise run check
